[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrawlee"
version = "0.1.0"
description = "Scrawlee: stealth HTTP client with proxies and parsing; includes scrawleemation (Botasaurus-style decorators and utilities)."
readme = "README.md"
authors = [
    { name = "Muhammad Saim", email = "saimsajidirl@gmail.com" }
]
requires-python = ">=3.8"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "curl_cffi>=0.7.1",
    "selectolax>=0.3.17",
    "lxml>=5.1.0",
    "beautifulsoup4>=4.12.3",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "build",
    "twine"
]

[tool.hatch.build.targets.sdist]
include = ["scrawlee", "scrawleemation"]

[tool.hatch.build.targets.wheel]
packages = ["scrawlee", "scrawleemation"]
